[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mvp-risk"
version = "0.4.0"
description = "Open-source Monte Carlo engine for Quantitative Cost & Schedule Risk Analysis (QCRA/QSRA)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luan Garcia Rodrigues" }]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scipy==1.17.1",
    "matplotlib==3.10.8",
    "reportlab==4.4.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
app = ["streamlit==1.61.1"]
dev = ["pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/Luanrods/MVP-Risk"

[project.scripts]
mvp-risk = "build_report:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools]
py-modules = ["build_report"]
